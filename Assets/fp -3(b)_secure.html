<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encrypted File - fp -3(b)</title>
<style>
  :root {
    --bg-page: #faf9f7;
    --bg-card: #ffffff;
    --ink: #14151a;
    --muted: #6b7280;
    --line: #e4e4e3;
    --green: #1b5e3f;
    --green-dark: #12402a;
    --green-tint: #e7f1ec;
    --red: #b3261e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg-page);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 1px 2px rgba(20, 21, 26, 0.04), 0 6px 20px rgba(20, 21, 26, 0.04);
    padding: 40px 36px;
    text-align: center;
  }

  .icon-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 18px;
  }

  .lock-icon {
    width: 38px;
    height: 38px;
    color: var(--ink);
    overflow: visible;
    transition: color 0.3s ease;
  }

  .lock-icon .shackle {
    transform-box: fill-box;
    transform-origin: 0% 100%;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .lock-icon.unlocked { color: var(--green); }
  .lock-icon.unlocked .shackle { transform: rotate(-32deg); }

  .eyebrow {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 14px;
  }

  h1 {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .sub {
    font-size: 14px;
    line-height: 1.55;
    color: var(--muted);
    margin-bottom: 30px;
  }

  .field { text-align: left; margin-bottom: 14px; }

  label {
    display: block;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  input[type="text"] {
    width: 100%;
    padding: 13px 14px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 16px;
    letter-spacing: 0.1em;
    text-align: center;
    color: var(--ink);
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 7px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input[type="text"]::placeholder { color: #b3b6bd; letter-spacing: normal; }

  input[type="text"]:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-tint);
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  input.shake { animation: shake 0.4s ease; border-color: var(--red); }

  button {
    width: 100%;
    margin-top: 6px;
    padding: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    background: var(--green);
    color: #ffffff;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.08s ease;
  }

  button:hover:not(:disabled) { background: var(--green-dark); }
  button:active:not(:disabled) { transform: scale(0.99); }
  button:disabled { opacity: 0.65; cursor: not-allowed; }

  button:focus-visible,
  .btn-outline:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    min-height: 18px;
    font-size: 13px;
    color: var(--red);
    margin-top: 12px;
    text-align: center;
  }

  .result img {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #ffffff;
    animation: fade-in 0.35s ease;
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .btn-outline {
    display: inline-block;
    margin-top: 16px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 7px;
    text-decoration: none;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .btn-outline:hover { background: var(--ink); color: #ffffff; }

  .footnote {
    margin-top: 28px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
  }

  @media (max-width: 460px) {
    .card { padding: 32px 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

    function hexToBytes(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) {
        bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
      }
      return bytes;
    }

    function base64ToBytes(b64) {
      const binStr = atob(b64);
      const bytes = new Uint8Array(binStr.length);
      for (let i = 0; i < binStr.length; i++) {
        bytes[i] = binStr.charCodeAt(i);
      }
      return bytes;
    }

    const pinInput = document.getElementById('pinInput');
    const errorMsg = document.getElementById('errorMsg');
    const unlockBtn = document.getElementById('unlockBtn');
    const btnLabel = document.getElementById('btnLabel');
    const spinner = document.getElementById('spinner');
    const lockIcon = document.getElementById('lockIcon');
    const eyebrow = document.getElementById('eyebrow');
    const title = document.getElementById('title');
    const sub = document.getElementById('sub');
    const unlockSection = document.getElementById('unlockSection');
    const resultSection = document.getElementById('resultSection');
    const decryptedImg = document.getElementById('decryptedImg');
    const downloadLink = document.getElementById('downloadLink');

    pinInput.addEventListener('keyup', function (e) {
      if (e.key === 'Enter') attemptUnlock();
    });

    pinInput.addEventListener('input', function () {
      errorMsg.textContent = '';
      pinInput.classList.remove('shake');
    });

    unlockBtn.addEventListener('click', attemptUnlock);

    function setLoading(isLoading) {
      unlockBtn.disabled = isLoading;
      spinner.hidden = !isLoading;
      btnLabel.textContent = isLoading ? 'Decrypting...' : 'Unlock file';
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      pinInput.classList.remove('shake');
      void pinInput.offsetWidth;
      pinInput.classList.add('shake');
    }

    async function attemptUnlock() {
      const pinRaw = pinInput.value.trim();
      const cleanPin = pinRaw.replace(/[^0-9a-zA-Z]/g, '');

      if (!cleanPin) {
        showError('Enter the access PIN to continue.');
        return;
      }

      setLoading(true);

      try {
        const enc = new TextEncoder();
        const pinData = enc.encode(cleanPin);

        const baseKey = await window.crypto.subtle.importKey(
          "raw", pinData, { name: "PBKDF2" }, false, ["deriveKey"]
        );

        const saltBytes = hexToBytes(SALT_HEX);
        const aesKey = await window.crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: saltBytes,
            iterations: 600000,
            hash: "SHA-256"
          },
          baseKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );

        const nonceBytes = hexToBytes(NONCE_HEX);
        const cipherBytes = base64ToBytes(CIPHERTEXT_B64);

        const decryptedBuffer = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: nonceBytes },
          aesKey,
          cipherBytes
        );

        const blob = new Blob([decryptedBuffer], { type: "image/png" });
        const imgUrl = URL.createObjectURL(blob);

        decryptedImg.src = imgUrl;
        downloadLink.href = imgUrl;

        setLoading(false);
        unlockSection.hidden = true;
        resultSection.hidden = false;
        lockIcon.classList.add('unlocked');
        eyebrow.textContent = 'Unlocked';
        title.textContent = 'File decrypted';
        sub.textContent = 'The PIN matched. This image exists only in your browser.';
      } catch (err) {
        console.error(err);
        setLoading(false);
        showError('Wrong PIN, or the file was altered.');
      }
    }
